name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: operry/mcp-test-1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only needed when we actually push, i.e. on main.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # On main: build and push tags <run number> and latest.
      # On pull requests: build only, to check the Dockerfile still works.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Pushed \`${IMAGE}:${{ github.run_number }}\` and \`${IMAGE}:latest\`" >> "$GITHUB_STEP_SUMMARY"
